name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cashier, admin-hazem, maqlis, store-orders]
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q android-capacitor.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare
        working-directory: android-capacitor/${{ matrix.app }}
        run: bash setup.sh
      - name: Build
        working-directory: android-capacitor/${{ matrix.app }}/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: android-capacitor/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
